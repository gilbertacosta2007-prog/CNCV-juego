name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Godot project
        uses: firebelley/godot-export@v6.1.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_debug: true
          presets: Android
      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CNBC-Android-APK
          path: $"{" + "{" + " steps.apk.outputs.path " + "}" + "}"
