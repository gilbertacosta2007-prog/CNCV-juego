name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_debug: true
          presets_to_export: Android

      - name: Verify APK
        shell: bash
        run: |
          test -f build/CNBC.apk
          ls -lh build/CNBC.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CNBC-Android-APK
          path: build/CNBC.apk
          if-no-files-found: error
